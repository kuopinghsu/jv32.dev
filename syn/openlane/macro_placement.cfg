# Macro placement -- 1x4 row (sram_1rw_1024x64, wpr=4: 247.88 x 386.12 um per macro)
# Arrangement: [DRAM0  DRAM1  IRAM0  IRAM1]  (single row, y=20)
#
# Inter-macro gap = 12 um (reduced from 80 um; sufficient for ~40 metal2/3 tracks)
#   col 0 DRAM[0]: x=10,  right=257.88
#   col 1 DRAM[1]: x=270, right=517.88
#   col 2 IRAM[0]: x=530, right=777.88
#   col 3 IRAM[1]: x=790, right=1037.88
#
# SRAM cluster: 10 to 1037.88 um (1027.88 um wide)
# Right clearance to core boundary (core right = 1090): 1090 - 1037.88 = 52.12 um
# SRAM row top: 20 + 386.12 = 406.12 um -> logic strip above (406.12 to 640 um = 233.9 um)
u_jv32.u_dram.g_tcm_4096_sram.g_bank[0].u_sub   10   20 N
u_jv32.u_dram.g_tcm_4096_sram.g_bank[1].u_sub  270   20 N
u_jv32.u_iram.g_tcm_4096_sram.g_bank[0].u_sub  530   20 N
u_jv32.u_iram.g_tcm_4096_sram.g_bank[1].u_sub  790   20 N

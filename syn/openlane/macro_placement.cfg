#   blue box  -> die boundary
#   green box -> SRAM macro envelopes
#
# Bottom-row placement: all macros share Y=20 and are evenly distributed
# across the widened core width with ~102.7 um edge/channel spacing.
#   DRAM[0] @ (112.70, 20), DRAM[1] @ (463.28, 20)
#   IRAM[0] @ (813.86, 20), IRAM[1] @ (1164.44, 20)
u_jv32.u_dram.g_tcm_4096_sram.g_bank[0].u_sub   112.70   20 N
u_jv32.u_dram.g_tcm_4096_sram.g_bank[1].u_sub   463.28   20 N
u_jv32.u_iram.g_tcm_4096_sram.g_bank[0].u_sub   813.86   20 N
u_jv32.u_iram.g_tcm_4096_sram.g_bank[1].u_sub  1164.44   20 N

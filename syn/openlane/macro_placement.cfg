# Macro placement for 1600 um wide die:
#   blue box  -> die boundary
#   green box -> SRAM macro envelopes
#
# Bottom-row placement: all macros share Y=50.
# 4 macros x 247.88 = 991.52 um; gaps = 20, 20, 500, 20, 20 um.
# Core: x = 10..1581.52 (1571.52 um usable).
# Gap pattern: 20 (left), 20, 500 (center), 20, 20 (right).
#   DRAM[1] @ (30.00, 50), DRAM[0] @ (297.88, 50)
#   IRAM[0] @ (1045.76, 50), IRAM[1] @ (1313.64, 50)
u_jv32.u_dram.g_tcm_4096_sram.g_bank[1].u_sub    30.00   50 N
u_jv32.u_dram.g_tcm_4096_sram.g_bank[0].u_sub   297.88   50 N
u_jv32.u_iram.g_tcm_4096_sram.g_bank[0].u_sub  1045.76   50 N
u_jv32.u_iram.g_tcm_4096_sram.g_bank[1].u_sub  1313.64   50 N

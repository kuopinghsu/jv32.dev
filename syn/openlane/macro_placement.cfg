# Macro placement for 1561.52 um wide die:
#   blue box  -> die boundary
#   green box -> SRAM macro envelopes
#
# Bottom-row placement: all macros share Y=50.
# 4 macros x 247.88 = 991.52 um; gaps = 50, 100, 300, 50, 50 um.
# Core width 10..1551.52 (1541.52 um usable).
# Gap pattern: 50 (left), 100, 300, 50, 50 (right).
#   DRAM[1] @ (60.00, 50), DRAM[0] @ (407.88, 50)
#   IRAM[0] @ (955.76, 50), IRAM[1] @ (1253.64, 50)
u_jv32.u_dram.g_tcm_4096_sram.g_bank[1].u_sub    60.00   50 N
u_jv32.u_dram.g_tcm_4096_sram.g_bank[0].u_sub   407.88   50 N
u_jv32.u_iram.g_tcm_4096_sram.g_bank[0].u_sub   955.76   50 N
u_jv32.u_iram.g_tcm_4096_sram.g_bank[1].u_sub  1253.64   50 N

# Macro placement -- 2x2 grid (sram_1rw_1024x64, wpr=4: 247.88 x 386.12 um per macro)
#
#   row 0: DRAM[0] @ (180, 80),  IRAM[0] @ (860, 80)
#   row 1: DRAM[1] @ (180, 620), IRAM[1] @ (860, 620)
#
# Channel widths:
#   horizontal channel ~= 860 - (180 + 247.88) = 432.12 um
#   vertical channel   ~= 620 - (80 + 386.12)  = 153.88 um
#
# This layout creates wider vertical and horizontal corridors for global
# routing demand around SRAM pin edges.
u_jv32.u_dram.g_tcm_4096_sram.g_bank[0].u_sub  180   80 N
u_jv32.u_dram.g_tcm_4096_sram.g_bank[1].u_sub  180  620 N
u_jv32.u_iram.g_tcm_4096_sram.g_bank[0].u_sub  860   80 N
u_jv32.u_iram.g_tcm_4096_sram.g_bank[1].u_sub  860  620 N

# Macro placement -- 2x2 grid (sram_1rw_1024x64, wpr=4: 247.88 x 386.12 um per macro)
#
#   row 0: DRAM[0] @ (220, 120),  IRAM[0] @ (1020, 120)
#   row 1: DRAM[1] @ (220, 760),  IRAM[1] @ (1020, 760)
#
# Channel widths:
#   horizontal channel ~= 1020 - (220 + 247.88) = 552.12 um
#   vertical channel   ~= 760 - (120 + 386.12)  = 253.88 um
#
# This layout increases both macro-to-macro corridors and edge margins to
# reduce localized routing demand around SRAM pin clusters.
u_jv32.u_dram.g_tcm_4096_sram.g_bank[0].u_sub   220   120 N
u_jv32.u_dram.g_tcm_4096_sram.g_bank[1].u_sub   220   760 N
u_jv32.u_iram.g_tcm_4096_sram.g_bank[0].u_sub  1020   120 N
u_jv32.u_iram.g_tcm_4096_sram.g_bank[1].u_sub  1020   760 N

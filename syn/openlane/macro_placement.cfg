# Macro placement for 1650 um wide die:
#   blue box  -> die boundary
#   green box -> SRAM macro envelopes
#
# Bottom-row placement: all macros share Y=50 and are evenly distributed
# across core width 10..1640 (1630 um usable).
# 4 macros x 247.88 = 991.52 um; 4 gaps = (1630 - 991.52) / 4 = 159.62 um.
# Gap pattern: 79.81 (half), 159.62, 159.62, 159.62, 79.81 (half).
#   DRAM[0] @ (89.81, 50), DRAM[1] @ (497.31, 50)
#   IRAM[0] @ (904.81, 50), IRAM[1] @ (1312.31, 50)
u_jv32.u_dram.g_tcm_4096_sram.g_bank[1].u_sub    89.81   50 N
u_jv32.u_dram.g_tcm_4096_sram.g_bank[0].u_sub   497.31   50 N
u_jv32.u_iram.g_tcm_4096_sram.g_bank[0].u_sub   904.81   50 N
u_jv32.u_iram.g_tcm_4096_sram.g_bank[1].u_sub  1312.31   50 N
